[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-regime-hmm"
version = "0.1.0"
description = "Bayesian regime-switching HMM on real SPY data: Gibbs sampling with FFBS, diagnostics, walk-forward backtest"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "yfinance"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]
