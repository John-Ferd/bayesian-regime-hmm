name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src scripts tests
      - run: pytest -q
      - run: python scripts/run_experiment.py --chains 2 --n-iter 200 --burn-in 100 --paths 3
